name: Build Launcher 2026 Map Preview

on:
  push:
    branches: [ map-integration-1.0.11 ]
  workflow_dispatch:

concurrency:
  group: launcher-2026-map-preview
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore stable signing key
        run: |
          base64 --decode ci/launcher-stable.jks.b64 > app/launcher-stable.jks
          keytool -list -keystore app/launcher-stable.jks -storepass android -alias androiddebugkey >/dev/null

      - name: Build signed preview APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/app/launcher-stable.jks
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS:="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android 7.1 startup smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 25
          arch: x86
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb logcat -c
            adb shell monkey -p com.aistudio.carlauncher.lzrk26 -c android.intent.category.LAUNCHER 1
            for i in {1..20}; do
              PID=$(adb shell pidof com.aistudio.carlauncher.lzrk26 | tr -d '\r')
              [ -n "$PID" ] && break
              sleep 1
            done
            test -n "$PID"
            sleep 5
            adb shell pidof com.aistudio.carlauncher.lzrk26
            adb logcat -b crash -d | tee api25-crash.log
            ! grep -q "com.aistudio.carlauncher.lzrk26" api25-crash.log

      - name: Upload map preview APK
        uses: actions/upload-artifact@v4
        with:
          name: Launcher-2026-1.0.11-Map-Preview
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 3
