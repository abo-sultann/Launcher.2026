name: Build Launcher 2026 Map Preview

on:
  push:
    branches: [ map-integration-1.0.11 ]
  workflow_dispatch:

concurrency:
  group: launcher-2026-map-preview
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore stable signing key
        run: |
          base64 --decode ci/launcher-stable.jks.b64 > app/launcher-stable.jks
          keytool -list -keystore app/launcher-stable.jks -storepass android -alias androiddebugkey >/dev/null

      - name: Build signed preview APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/app/launcher-stable.jks
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Upload map preview APK
        uses: actions/upload-artifact@v4
        with:
          name: Launcher-2026-1.0.11-Map-Preview
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 3
