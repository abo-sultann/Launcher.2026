name: Export Owner Signature

on:
  push:
    branches: [ "main" ]

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Upload owner signature
        uses: actions/upload-artifact@v4
        with:
          name: owner-signature
          path: app/src/main/res/drawable-nodpi/owner_signature.png
          retention-days: 1
