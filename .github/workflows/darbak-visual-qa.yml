name: Darbak visual QA
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: visual-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Reserve space for the API 25 emulator
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk
          df -h /
      - name: Restore existing stable key for debug signing
        run: base64 --decode ci/launcher-stable.jks.b64 > app/launcher-stable.jks
      - uses: android-actions/setup-android@v3
      - run: chmod +x gradlew
      - run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 7.1 visual check
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 25
          target: default
          arch: x86
          ram-size: 1024M
          disk-size: 2048M
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -skin 1024x600
          disable-animations: true
          script: |
            adb shell wm size 1024x600
            adb shell wm density 160
            curl --fail --location --retry 2 --connect-timeout 20 --max-time 90 'https://drive.usercontent.google.com/download?id=1SfhLZdmlBDv0fIwjVunh2GX3np2mgdZC&export=download&confirm=t' -o /tmp/launcher-previous.apk
            adb install -r -g /tmp/launcher-previous.apk
            adb install -r -g app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e mode seed com.aistudio.carlauncher.lzrk26.test/com.example.LauncherReviewRunner
            adb install -r -g app/build/outputs/apk/debug/app-debug.apk
            python3 tools/run_launcher_review.py
      - name: Collect signing verifier
        if: always()
        run: |
          mkdir -p qa-visual
          cp "$(find "$ANDROID_HOME/build-tools" -name apksigner.jar | sort -V | tail -1)" qa-visual/apksigner.jar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Darbak-visual-QA
          path: qa-visual/
          retention-days: 1
          if-no-files-found: error
