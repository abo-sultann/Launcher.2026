name: Stable runtime migration

on:
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: stable-runtime-migration
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Stable runtime wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path

          vm = Path('app/src/main/java/com/example/ui/viewmodel/MainViewModel.kt')
          s = vm.read_text()
          old = 'private val offroadTrackManager = OffroadTrackManager(application)'
          new = 'private val offroadTrackManager = (application as com.example.CarLauncherApp).offroadTrackManager'
          if old in s:
              vm.write_text(s.replace(old, new, 1))

          settings = Path('app/src/main/java/com/example/ui/screens/SettingsScreen.kt')
          s = settings.read_text()
          anchor = '''                        SettingsCategory.SYSTEM -> {\n                            item { ActionButton("فحص شامل للنظام", Icons.Default.HealthAndSafety) { viewModel.runDiagnostics(); onOpenDiagnostics() } }'''
          replacement = '''                        SettingsCategory.SYSTEM -> {\n                            item { StableSystemPanel() }\n                            item { ActionButton("فحص شامل للنظام", Icons.Default.HealthAndSafety) { viewModel.runDiagnostics(); onOpenDiagnostics() } }'''
          if anchor in s and 'item { StableSystemPanel() }' not in s:
              settings.write_text(s.replace(anchor, replacement, 1))
          PY

      - name: Commit migration when needed
        run: |
          if git diff --quiet; then
            echo "Stable migration already applied"
            exit 0
          fi
          git config user.name "Launcher 2026 CI"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/example/ui/viewmodel/MainViewModel.kt app/src/main/java/com/example/ui/screens/SettingsScreen.kt
          git commit -m "Wire Stable update backup and tracking runtime"
          git push
