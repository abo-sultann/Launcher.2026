name: Build Launcher 2026 APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, labeled ]
  workflow_dispatch:

concurrency:
  group: launcher-2026-apk-main
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.action != 'labeled'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore fixed signing key
        run: |
          base64 --decode ci/launcher-stable.jks.b64 > app/launcher-stable.jks
          keytool -list -keystore app/launcher-stable.jks -storepass android -alias androiddebugkey >/dev/null

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Test Android 7 startup and rebuilt models
        run: >-
          ./gradlew :app:testDebugUnitTest
          --tests com.example.LauncherApi25SmokeTest
          --tests com.example.WidgetModelsTest
          --stacktrace --no-daemon

      - name: Build signed Stable APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/app/launcher-stable.jks
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Upload Stable APK
        uses: actions/upload-artifact@v4
        with:
          name: Launcher-2026-Stable
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 3

  map-pack:
    if: github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'documentation'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download official 2026 GCC map
        run: |
          mkdir -p map-pack
          curl --fail --location --retry 5 --retry-delay 4 \
            https://download.mapsforge.org/maps/v5/asia/gcc-states.map \
            --output map-pack/Launcher-2026-GCC.map
          bytes=$(stat -c%s map-pack/Launcher-2026-GCC.map)
          test "$bytes" -gt 250000000
          sha256sum map-pack/Launcher-2026-GCC.map | tee map-pack/SHA256.txt
          printf 'Source: https://download.mapsforge.org/maps/v5/asia/gcc-states.map\nBytes: %s\n' "$bytes" > map-pack/MAP-INFO.txt

      - name: Upload verified map package
        uses: actions/upload-artifact@v4
        with:
          name: Launcher-2026-GCC-Map
          path: map-pack/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
